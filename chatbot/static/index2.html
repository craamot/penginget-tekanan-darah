<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F6F2;
    --surface: #FFFFFF;
    --ink: #18222B;
    --muted: #66717C;
    --line: #E1E4DC;
    --accent: #0E6B68;
    --accent-ink: #FFFFFF;
    --user-bg: #18222B;
    --user-ink: #F5F6F2;
    --code-bg: #EEF0EA;
    --danger: #B3261E;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1518;
      --surface: #162026;
      --ink: #E8EDEA;
      --muted: #8E9AA3;
      --line: #25323A;
      --accent: #4FC3B8;
      --accent-ink: #0F1518;
      --user-bg: #223038;
      --user-ink: #E8EDEA;
      --code-bg: #0B1013;
      --danger: #FF8A80;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.6 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { display: flex; flex-direction: column; height: 100dvh; }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .mark {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
    font-size: 14px; font-weight: 700;
    flex: none;
  }
  .ghost {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 14px; font-size: 14px; cursor: pointer;
    transition: border-color .15s;
  }
  .ghost:hover { border-color: var(--accent); }

  /* Percakapan */
  .scroller { flex: 1; overflow-y: auto; }
  .column { max-width: 720px; margin: 0 auto; padding: 28px 20px 12px; }

  .empty { padding-top: 10vh; }
  .empty h1 {
    margin: 0 0 10px;
    font-size: clamp(28px, 5vw, 40px);
    line-height: 1.15; letter-spacing: -0.02em; font-weight: 700;
    text-wrap: balance;
  }
  .empty p { margin: 0; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
  .chip {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 15px; font-size: 14px; cursor: pointer;
    transition: border-color .15s;
  }
  .chip:hover { border-color: var(--accent); }

  .msg { display: flex; gap: 12px; margin: 0 0 26px; }
  .msg.user { justify-content: flex-end; }
  .msg.user .body {
    background: var(--user-bg); color: var(--user-ink);
    padding: 10px 16px; border-radius: 20px 20px 6px 20px;
    max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.bot .mark { margin-top: 2px; }
  .msg.bot .body { flex: 1; min-width: 0; }

  /* Indikator mengetik */
  .typing { display: inline-flex; gap: 5px; padding: 10px 0; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); opacity: .5;
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: .6; } }

  /* Hasil Markdown */
  .prose > :first-child { margin-top: 0; }
  .prose > :last-child { margin-bottom: 0; }
  .prose p, .prose ul, .prose ol, .prose blockquote, .prose table { margin: 0 0 14px; }
  .prose ul, .prose ol { padding-left: 22px; }
  .prose li { margin: 4px 0; }
  .prose h1, .prose h2, .prose h3 { margin: 22px 0 8px; line-height: 1.3; letter-spacing: -0.01em; }
  .prose h1 { font-size: 1.35em; } .prose h2 { font-size: 1.2em; } .prose h3 { font-size: 1.05em; }
  .prose a { color: var(--accent); text-underline-offset: 3px; }
  .prose blockquote { padding-left: 14px; border-left: 3px solid var(--line); color: var(--muted); }
  .prose table { display: block; overflow-x: auto; border-collapse: collapse; font-size: 14.5px; }
  .prose th, .prose td { border: 1px solid var(--line); padding: 7px 12px; text-align: left; }
  .prose th { background: var(--code-bg); font-weight: 600; }
  .prose hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
  .prose :not(pre) > code {
    background: var(--code-bg); padding: .15em .4em; border-radius: 6px; font-size: .9em;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .codeblock { position: relative; margin: 0 0 14px; }
  .codeblock pre {
    margin: 0; background: var(--code-bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 16px; overflow-x: auto;
    font-size: 14px; line-height: 1.55;
  }
  .codeblock code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .copy {
    position: absolute; top: 8px; right: 8px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 3px 10px; font-size: 12.5px; cursor: pointer;
  }
  .copy:hover { border-color: var(--accent); }

  /* Error */
  .error { border-left: 3px solid var(--danger); padding: 4px 0 4px 14px; }
  .error p { margin: 0 0 8px; color: var(--danger); }
  .retry {
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 13px; font-size: 14px; cursor: pointer;
  }
  .retry:hover { border-color: var(--accent); }

  /* Kolom ketik */
  .composer-wrap { padding: 8px 20px 12px; }
  .composer {
    max-width: 720px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 24px; padding: 6px 6px 6px 18px;
    transition: border-color .15s, box-shadow .15s;
  }
  .composer:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  textarea {
    flex: 1; border: 0; outline: 0; resize: none; background: transparent;
    color: inherit; font: inherit; line-height: 1.5;
    max-height: 200px; padding: 8px 0;
  }
  textarea::placeholder { color: var(--muted); }
  .send {
    width: 40px; height: 40px; flex: none; border: 0; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; cursor: pointer;
    transition: opacity .15s;
  }
  .send:disabled { opacity: .3; cursor: not-allowed; }
  .note { max-width: 720px; margin: 8px auto 0; text-align: center; font-size: 12.5px; color: var(--muted); }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="mark" id="brandMark"></span><span id="brandName"></span></div>
    <button class="ghost" id="newChat" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Chat baru
    </button>
  </header>

  <main class="scroller" id="scroller">
    <div class="column">
      <section class="empty" id="empty">
        <h1 id="greeting"></h1>
        <p>Tanya apa saja, atau pilih salah satu contoh di bawah.</p>
        <div class="chips" id="chips"></div>
      </section>
      <div id="messages" aria-live="polite"></div>
    </div>
  </main>

  <div class="composer-wrap">
    <div class="composer">
      <label class="sr" for="input">Pesan</label>
      <textarea id="input" rows="1" placeholder="Tulis pesan…" autofocus></textarea>
      <button class="send" id="send" type="button" aria-label="Kirim pesan" disabled></button>
    </div>
    <p class="note">Jawaban AI bisa keliru. Periksa kembali informasi yang penting.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
  // ====== Pengaturan: ubah sesuai kebutuhan ======
  const BOT_NAME = "Asisten";
  const SUGGESTIONS = [
    "Jelaskan konsep yang sulit dengan bahasa sederhana",
    "Bantu saya menulis email yang sopan",
    "Buatkan rencana belajar satu minggu",
    "Beri ide nama untuk usaha kecil",
  ];
  // ===============================================

  const $ = (s) => document.querySelector(s);
  const scroller = $("#scroller"), messagesEl = $("#messages"), emptyEl = $("#empty");
  const input = $("#input"), sendBtn = $("#send");
  const STORE_KEY = "chatbot:messages:v1";

  const ICON_SEND = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  const ICON_STOP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>';

  const state = { messages: [], busy: false, controller: null };

  // ---- Markdown ----
  marked.setOptions({ gfm: true, breaks: true });
  DOMPurify.addHook("afterSanitizeAttributes", (node) => {
    if (node.tagName === "A") {
      node.setAttribute("target", "_blank");
      node.setAttribute("rel", "noopener noreferrer");
    }
  });

  function renderMarkdown(el, text) {
    el.innerHTML = DOMPurify.sanitize(marked.parse(text));
    el.querySelectorAll("pre").forEach((pre) => {
      const wrap = document.createElement("div");
      wrap.className = "codeblock";
      pre.replaceWith(wrap);
      wrap.appendChild(pre);
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "copy";
      btn.textContent = "Salin";
      wrap.appendChild(btn);
    });
  }

  messagesEl.addEventListener("click", async (e) => {
    const btn = e.target.closest(".copy");
    if (!btn) return;
    const code = btn.parentElement.querySelector("code, pre");
    try {
      await navigator.clipboard.writeText(code.innerText);
      btn.textContent = "Tersalin";
      setTimeout(() => (btn.textContent = "Salin"), 1500);
    } catch {
      btn.textContent = "Gagal menyalin";
    }
  });

  // ---- Penyimpanan lokal (opsional, tidak wajib berhasil) ----
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state.messages)); } catch {}
  }
  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
      return Array.isArray(data) ? data : [];
    } catch { return []; }
  }

  // ---- Tampilan ----
  function greeting() {
    const h = new Date().getHours();
    const part = h < 11 ? "pagi" : h < 15 ? "siang" : h < 18 ? "sore" : "malam";
    return `Selamat ${part}. Ada yang bisa dibantu?`;
  }

  function nearBottom() {
    return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 140;
  }
  function scrollToBottom() { scroller.scrollTop = scroller.scrollHeight; }

  function addMessage(role, text) {
    const row = document.createElement("div");
    row.className = "msg " + (role === "user" ? "user" : "bot");
    const body = document.createElement("div");
    body.className = "body";
    if (role === "user") {
      body.textContent = text;
    } else {
      const mark = document.createElement("span");
      mark.className = "mark";
      mark.textContent = BOT_NAME.charAt(0).toUpperCase();
      row.appendChild(mark);
      body.classList.add("prose");
      if (text) renderMarkdown(body, text);
      else body.innerHTML = '<span class="typing" role="status" aria-label="Sedang mengetik"><i></i><i></i><i></i></span>';
    }
    row.appendChild(body);
    messagesEl.appendChild(row);
    return { row, body };
  }

  function updateEmpty() {
    emptyEl.hidden = state.messages.length > 0 || messagesEl.children.length > 0;
  }

  function setBusy(busy) {
    state.busy = busy;
    sendBtn.innerHTML = busy ? ICON_STOP : ICON_SEND;
    sendBtn.setAttribute("aria-label", busy ? "Hentikan jawaban" : "Kirim pesan");
    refreshSend();
  }
  function refreshSend() {
    sendBtn.disabled = !state.busy && input.value.trim() === "";
  }
  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 200) + "px";
  }

  // Render ulang secukupnya saat streaming (maksimal sekali per frame)
  let raf = 0;
  function scheduleRender(el, text) {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const stick = nearBottom();
      renderMarkdown(el, text);
      if (stick) scrollToBottom();
    });
  }

  function showError(refs, userRow, text, message) {
    refs.body.classList.remove("prose");
    refs.body.innerHTML = "";
    const box = document.createElement("div");
    box.className = "error";
    const p = document.createElement("p");
    p.textContent = message;
    const retry = document.createElement("button");
    retry.type = "button";
    retry.className = "retry";
    retry.textContent = "Coba lagi";
    retry.addEventListener("click", () => {
      userRow.remove();
      refs.row.remove();
      send(text);
    });
    box.append(p, retry);
    refs.body.appendChild(box);
  }

  // ---- Kirim pesan ----
  async function send(raw) {
    const text = raw.trim();
    if (!text || state.busy) return;

    state.messages.push({ role: "user", content: text });
    const userRefs = addMessage("user", text);
    const botRefs = addMessage("bot", "");
    updateEmpty();
    input.value = "";
    autosize();
    scrollToBottom();
    setBusy(true);

    state.controller = new AbortController();
    let reply = "";

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: state.messages }),
        signal: state.controller.signal,
      });
      if (!res.ok) {
        let msg = "Terjadi kesalahan di server.";
        try { msg = (await res.json()).detail || msg; } catch {}
        throw new Error(msg);
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        reply += decoder.decode(value, { stream: true });
        scheduleRender(botRefs.body, reply);
      }
      reply += decoder.decode();
    } catch (err) {
      cancelAnimationFrame(raf); raf = 0;
      if (err.name === "AbortError") {
        if (!reply) {
          // Dibatalkan sebelum ada jawaban: kembalikan pesan ke kolom ketik
          state.messages.pop();
          userRefs.row.remove();
          botRefs.row.remove();
          input.value = text;
          autosize();
        }
      } else {
        state.messages.pop();
        showError(botRefs, userRefs.row, text, err instanceof TypeError
          ? "Tidak bisa terhubung ke server. Pastikan server masih berjalan."
          : err.message);
        reply = "";
        state.controller = null;
        setBusy(false);
        save();
        return;
      }
    }

    cancelAnimationFrame(raf); raf = 0;
    if (reply) {
      renderMarkdown(botRefs.body, reply);
      state.messages.push({ role: "assistant", content: reply });
    }
    state.controller = null;
    setBusy(false);
    save();
    updateEmpty();
    input.focus();
  }

  // ---- Event ----
  sendBtn.addEventListener("click", () => {
    if (state.busy) state.controller?.abort();
    else send(input.value);
  });
  input.addEventListener("input", () => { autosize(); refreshSend(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send(input.value);
    }
  });
  $("#newChat").addEventListener("click", () => {
    state.controller?.abort();
    state.messages = [];
    messagesEl.innerHTML = "";
    save();
    setBusy(false);
    updateEmpty();
    input.focus();
  });

  // ---- Mulai ----
  document.title = BOT_NAME;
  $("#brandName").textContent = BOT_NAME;
  $("#brandMark").textContent = BOT_NAME.charAt(0).toUpperCase();
  $("#greeting").textContent = greeting();
  SUGGESTIONS.forEach((s) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = s;
    b.addEventListener("click", () => send(s));
    $("#chips").appendChild(b);
  });

  state.messages = load();
  state.messages.forEach((m) => addMessage(m.role === "user" ? "user" : "bot", m.content));
  updateEmpty();
  setBusy(false);
  scrollToBottom();
</script>
</body>
</html>
